project:
  type: book
  output-dir: _book
  
book:
  sidebar:
    tools:
      - icon: file-pdf
        text: "Download PDF"
        href: https://github.com/rich-ramsey/doing-psych-brain-science/raw/main/_book-pdf/Doing-Psychological-and-Brain-Science-Research--A-Field-Report-On-Scientific-Workflows.pdf
        target: _blank
  chapters:
    - index.qmd

    - part: intro.qmd
      chapters: 
        - 01-mind-brain.qmd
        - 02-history.qmd
        - 03-done.qmd
        - 04-infrastructure.qmd
        
    - part: project-workflow.qmd
      chapters: 
        - 05-overview.qmd
        - 06-planning.qmd
        - 07-data-management.qmd
        - 08-data-processing.qmd
        - 09-data-visualisation.qmd
        - 10-inferential-workflow.qmd
        - 11-dissemination.qmd
        - 12-limitations.qmd

    - references.qmd

format:
  html:
    theme:
      dark: solar
      light: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    link-external-newwindow: true